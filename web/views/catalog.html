<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ShopTonBot - Elite Edition v11.0</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --accent: #ff0050;
            --accent-glow: rgba(255, 0, 80, 0.5);
            --secondary: #0096ff;
            --secondary-glow: rgba(0, 150, 255, 0.4);
            --card: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.08);
            --glass: blur(35px) saturate(220%);
            --safe-area-bottom: env(safe-area-inset-bottom);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg); color: #fff; padding: 0; margin: 0; overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 100% 0%, rgba(255, 0, 80, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 0% 100%, rgba(0, 150, 255, 0.08) 0%, transparent 40%);
            min-height: 100vh;
        }

        /* NAVIGATION BAR */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: calc(85px + var(--safe-area-bottom));
            background: rgba(8, 8, 8, 0.9); backdrop-filter: var(--glass);
            border-top: 1px solid var(--border); display: flex; justify-content: space-around;
            align-items: flex-start; z-index: 9000; padding-top: 15px;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 6px; opacity: 0.3; transition: 0.4s; width: 33%; }
        .nav-item.active { opacity: 1; color: #fff; transform: translateY(-4px); }
        .nav-icon { font-size: 26px; transition: 0.3s; position: relative; display: flex; align-items: center; justify-content: center; }
        .nav-item.active .nav-icon::after { content: ''; position: absolute; width: 40px; height: 40px; background: var(--accent-glow); filter: blur(15px); z-index: -1; border-radius: 50%; }
        .nav-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; }

        /* HEADER */
        .app-header {
            padding: 25px 20px 10px 20px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(15px); z-index: 1000;
        }
        .logo { font-size: 28px; font-weight: 900; letter-spacing: -1px; }
        .logo span { color: var(--accent); text-shadow: 0 0 20px var(--accent-glow); }
        .cart-icon-btn { position: relative; font-size: 24px; cursor: pointer; }
        .cart-badge-dot { position: absolute; top: -2px; right: -2px; width: 10px; height: 10px; background: var(--accent); border-radius: 50%; border: 2px solid #000; display: none; }

        /* CAROUSEL - COMPACT */
        .featured-section { margin-bottom: 25px; padding: 0 20px; }
        .carousel { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; padding: 5px 0 10px 0; }
        .carousel::-webkit-scrollbar { display: none; }
        .featured-item {
            min-width: 240px; height: 130px; border-radius: 24px; position: relative;
            overflow: hidden; flex-shrink: 0; border: 1px solid var(--border); transition: 0.3s;
        }
        .featured-item:active { transform: scale(0.97); }
        .featured-item img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        .featured-content { position: absolute; inset: 0; background: linear-gradient(transparent, rgba(0,0,0,0.85)); padding: 18px; display: flex; flex-direction: column; justify-content: flex-end; }
        .featured-badge { position: absolute; top: 12px; left: 12px; background: var(--accent); padding: 4px 12px; border-radius: 100px; font-size: 10px; font-weight: 900; }
        .featured-title { font-size: 18px; font-weight: 800; }

        /* CATEGORIES & SEARCH */
        .search-area { padding: 0 20px 15px 20px; }
        .search-bar { background: var(--card); border: 1px solid var(--border); border-radius: 18px; display: flex; align-items: center; padding: 12px 18px; gap: 10px; }
        .search-bar input { background: none; border: none; color: #fff; font-size: 15px; width: 100%; outline: none; font-weight: 500; }
        
        .categories-scroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 0 20px 15px 20px; }
        .categories-scroll::-webkit-scrollbar { display: none; }
        .cat-chip { padding: 9px 18px; background: var(--card); border: 1px solid var(--border); border-radius: 100px; font-size: 12px; font-weight: 700; white-space: nowrap; transition: 0.3s; }
        .cat-chip.active { background: #fff; color: #000; border-color: #fff; }

        /* GRID */
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px 180px 20px; } /* Increased padding-bottom to avoid nav overlap */
        .card { background: var(--card); border-radius: 28px; border: 1px solid var(--border); overflow: hidden; position: relative; animation: cardFadeIn 0.5s backwards; }
        @keyframes cardFadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .card-img { width: 100%; aspect-ratio: 1; object-fit: cover; }
        .card-content { padding: 12px; }
        .card-name { font-size: 14px; font-weight: 700; margin-bottom: 3px; opacity: 0.9; height: 34px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-price { font-size: 17px; font-weight: 900; color: var(--accent); }
        .add-btn { position: absolute; bottom: 12px; right: 12px; width: 38px; height: 38px; background: #fff; color: #000; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; }
        .card-badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); padding: 3px 8px; border-radius: 8px; font-size: 9px; font-weight: 900; color: var(--accent); z-index: 10; }
        .admin-action { position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; background: var(--secondary); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; z-index: 20; }

        /* ORDERS VIEW */
        .order-card { background: var(--card); border: 1px solid var(--border); border-radius: 22px; padding: 18px; margin-bottom: 12px; position: relative; }
        .order-status { position: absolute; top: 18px; right: 18px; padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: 900; text-transform: uppercase; }
        .status-pending { background: #ffaa00; color: #000; }
        .status-delivered { background: #00ff88; color: #000; }
        .status-canceled { background: #ff4444; color: #fff; }

        /* FLOAT CART */
        .cart-float {
            position: fixed; bottom: calc(105px + var(--safe-area-bottom)); left: 20px; right: 20px;
            background: var(--accent); height: 60px; border-radius: 20px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 22px; font-weight: 900; box-shadow: 0 15px 30px var(--accent-glow);
            transform: translateY(200px); transition: 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 8000; cursor: pointer;
        }
        .cart-float.visible { transform: translateY(0); }

        /* MODALS */
        .modal { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; flex-direction: column; transform: translateX(100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .modal.open { transform: translateX(0); }
        .modal-header { padding: 30px 20px 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        
        .sheet { position: fixed; bottom: 0; left: 0; right: 0; background: #0a0a0a; border-radius: 40px 40px 0 0; border-top: 1px solid var(--border); z-index: 10001; padding: 30px 20px; transform: translateY(100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .sheet.open { transform: translateY(0); }

        .btn-elite { width: 100%; height: 56px; background: #fff; color: #000; border: none; border-radius: 18px; font-size: 15px; font-weight: 900; box-shadow: 0 10px 20px rgba(255,255,255,0.1); }
        
        #loading-screen { position: fixed; inset: 0; background: #000; z-index: 20000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.5s; }
        .loader-bar { width: 120px; height: 2px; background: rgba(255,255,255,0.05); border-radius: 10px; margin-top: 20px; overflow: hidden; }
        .loader-fill { height: 100%; background: var(--accent); width: 0%; transition: 0.5s; }

        .empty-state { text-align: center; padding: 60px 20px; opacity: 0.4; font-weight: 700; font-size: 14px; }
    </style>
</head>
<body>
    <div id="loading-screen">
        <h1 style="font-size:28px; font-weight:900; letter-spacing:-1px;">ELITE<span>SHOP</span></h1>
        <div class="loader-bar"><div class="loader-fill" id="loader-fill"></div></div>
    </div>

    <div id="page-shop" class="page active">
        <div class="app-header">
            <div class="logo">SHOP<span>VIP</span></div>
            <div style="display:flex; align-items:center; gap:15px">
                <div id="admin-badge" class="admin-action" style="display:none; position:static; width:auto; padding:0 10px; font-size:10px; font-weight:900;">ADMIN</div>
                <div class="cart-icon-btn" onclick="openCheckout()">🛒<div class="cart-badge-dot" id="cart-dot"></div></div>
            </div>
        </div>

        <div class="search-area"><div class="search-bar"><span>🔍</span><input type="text" placeholder="Rechercher une pépite..." id="search-input" oninput="handleSearch()"></div></div>

        <div class="categories-scroll" id="categories"></div>

        <div class="featured-section"><div class="carousel" id="featured-carousel"></div></div>

        <div class="main-grid" id="products"></div>
    </div>

    <!-- PAGE: ORDERS -->
    <div id="page-orders" class="page" style="display:none; padding:30px 20px 150px 20px;">
        <h1 style="font-size:28px; font-weight:900; margin-bottom:20px;">SUIVI LIVE 🚚</h1>
        <div id="orders-list"></div>
    </div>

    <!-- PAGE: PROFILE -->
    <div id="page-profile" class="page" style="display:none; padding:30px 20px 150px 20px;">
        <h1 style="font-size:28px; font-weight:900; margin-bottom:20px;">MEMBRE VIP 👑</h1>
        <div style="background:var(--card); padding:25px; border-radius:30px; text-align:center; margin-bottom:20px; border:1px solid var(--border);">
            <div style="font-size:36px; font-weight:900; color:var(--accent);" id="user-balance">0.00€</div>
            <div style="font-size:11px; font-weight:800; opacity:0.4; letter-spacing:1.5px; margin-top:5px;">SOLDE WALLET</div>
        </div>
        <div style="background:var(--card); border-radius:24px; overflow:hidden; border:1px solid var(--border);">
            <div onclick="copyReferral()" style="padding:18px 20px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border);">
                <div><div style="font-weight:800; font-size:15px;">🤝 PARRAINAGE</div><div style="font-size:11px; opacity:0.4;">Invitez vos contacts</div></div>
                <div style="color:var(--accent); font-weight:900; font-size:12px;">COPIER</div>
            </div>
            <div id="hotline-btn" style="padding:18px 20px; display:flex; justify-content:space-between; align-items:center;">
                <div><div style="font-weight:800; font-size:15px;">🆘 CONCIERGERIE 24/7</div><div style="font-size:11px; opacity:0.4;">Assistance prioritaire</div></div>
                <div style="font-size:22px;">💬</div>
            </div>
        </div>
    </div>

    <div class="cart-float" id="cart-bar" onclick="openCheckout()">
        <div style="display:flex; align-items:center; gap:10px;"><span style="background:rgba(255,255,255,0.2); padding:5px 12px; border-radius:10px;" id="cart-count">0</span><span>VOIR LA COMMANDE</span></div>
        <div id="cart-total" style="font-size:16px;">0.00€</div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchPage('shop', this)"><div class="nav-icon">💎</div><div class="nav-label">Shop</div></div>
        <div class="nav-item" onclick="switchPage('orders', this)"><div class="nav-icon">📦</div><div class="nav-label">Suivi</div></div>
        <div class="nav-item" onclick="switchPage('profile', this)"><div class="nav-icon">👑</div><div class="nav-label">Profil</div></div>
    </div>

    <div class="sheet" id="selection-modal">
        <h2 id="modal-product-name" style="font-size:22px; font-weight:900; margin-bottom:5px;">Produit</h2>
        <p id="modal-product-desc" style="font-size:13px; opacity:0.4; margin-bottom:25px;">Choisissez la quantité :</p>
        <div id="modal-options" style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:30px;"></div>
        <button class="btn-elite" onclick="addSelectionToCart()">AJOUTER AU PANIER</button>
        <p onclick="closeSelectionModal()" style="text-align:center; margin-top:20px; font-size:13px; font-weight:800; opacity:0.3;">FERMER</p>
    </div>

    <div class="modal" id="checkout-overlay">
        <div class="modal-header"><h2 style="font-weight:900; font-size:24px;">PANIER</h2><div style="font-size:28px" onclick="closeCheckout()">✕</div></div>
        <div style="padding:20px; flex:1; overflow-y:auto;" id="checkout-content"></div>
        <div id="checkout-footer" style="padding:20px; border-top:1px solid var(--border); display:none">
             <div style="display:flex; justify-content:space-between; margin-bottom:15px; font-weight:900;"><span>Total :</span><span id="final-total" style="color:var(--accent); font-size:22px;">0.00€</span></div>
             <button class="btn-elite" id="btn-next" style="background:var(--accent); color:#fff;" onclick="nextStep()">COMMANDER</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); tg.ready();

        let allProducts = [];
        let cart = [];
        let userInfo = null;
        let activeProduct = null;
        let activeOption = null;
        let checkoutStep = 1;

        async function init() {
            setLoader(30);
            try {
                const uid = tg.initDataUnsafe?.user?.id;
                const [pRes, uRes] = await Promise.all([
                    fetch('/api/products'),
                    uid ? fetch(`/api/user-info?userId=telegram_${uid}`) : Promise.resolve(null)
                ]);
                setLoader(80);
                allProducts = await pRes.json();
                if (uRes && uRes.ok) userInfo = await uRes.json();
                if (userInfo?.isAdmin) document.getElementById('admin-badge').style.display = 'flex';
                renderShop();
                updateProfileUI();
                setLoader(100);
                setTimeout(() => { document.getElementById('loading-screen').style.opacity = '0'; setTimeout(() => document.getElementById('loading-screen').style.display='none', 500); }, 300);
            } catch (e) { tg.showAlert("Erreur réseau"); }
        }

        function setLoader(p) { document.getElementById('loader-fill').style.width = p+'%'; }

        function switchPage(p, el) {
            document.querySelectorAll('.page').forEach(pg => pg.style.display = 'none');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(`page-${p}`).style.display = 'block';
            el.classList.add('active');
            if (p === 'orders') loadOrders();
            tg.HapticFeedback.impactOccurred('medium');
            updateCartUI();
        }

        function renderShop() {
            // Carousel - Dynamically use Featured products
            const carousel = document.getElementById('featured-carousel');
            const featured = allProducts.filter(p => p.is_featured);
            carousel.innerHTML = '';
            
            const displayFeatured = featured.length ? featured : [
                { id:'f1', name: "SÉLECTION VIP", promo: "LIMITÉ", image_url: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600" },
                { id:'f2', name: "NOUVEAUTÉS", promo: "EXCLUSIF", image_url: "https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?w=600" }
            ];

            displayFeatured.forEach(f => {
                const d = document.createElement('div');
                d.className = 'featured-item';
                d.onclick = () => f.id.startsWith('f') ? null : openModal(f.id);
                const img = f.image_url || `https://placehold.co/600x300/111/fff?text=${encodeURIComponent(f.name)}`;
                d.innerHTML = `<img src="${img}"><div class="featured-badge">${f.promo || 'À LA UNE'}</div><div class="featured-content"><div class="featured-title">${f.name}</div></div>`;
                carousel.appendChild(d);
            });

            // Categories
            const cats = ['TOUT', ...new Set(allProducts.map(p => p.category).filter(c => c))];
            const catContainer = document.getElementById('categories');
            catContainer.innerHTML = '';
            cats.forEach(c => {
                const d = document.createElement('div');
                d.className = `cat-chip ${c === 'TOUT' ? 'active' : ''}`;
                d.innerText = c.toUpperCase();
                d.onclick = () => { document.querySelectorAll('.cat-chip').forEach(t => t.classList.remove('active')); d.classList.add('active'); renderGrid(c === 'TOUT' ? allProducts : allProducts.filter(p => p.category === c)); };
                catContainer.appendChild(d);
            });
            renderGrid(allProducts);
        }

        function renderGrid(prods) {
            const container = document.getElementById('products');
            container.innerHTML = '';
            prods.forEach((p, i) => {
                const d = document.createElement('div'); d.className = 'card'; d.style.animationDelay = `${i * 0.05}s`;
                const img = p.image_url || `https://placehold.co/400x400/111/fff?text=${encodeURIComponent(p.name)}`;
                d.innerHTML = `
                    ${userInfo?.isAdmin ? `<div class="admin-action" onclick="toggleF('${p.id}', event)">${p.is_featured ? '⭐' : '➕'}</div>` : ''}
                    <div class="card-badge">${p.promo || (p.is_featured ? 'TOP' : 'ELITE')}</div>
                    <img src="${img}" class="card-img" onclick="openModal('${p.id}')">
                    <div class="card-content" onclick="openModal('${p.id}')">
                        <div class="card-name">${p.name}</div>
                        <div class="card-price">${p.price}€</div>
                    </div>
                    <div class="add-btn" onclick="openModal('${p.id}', event)">+</div>
                `;
                container.appendChild(d);
            });
        }

        async function loadOrders() {
            const cont = document.getElementById('orders-list');
            cont.innerHTML = '<div class="empty-state">Chargement...</div>';
            const uid = tg.initDataUnsafe?.user?.id;
            try {
                const res = await fetch(`/api/user-orders?userId=telegram_${uid}`);
                const orders = await res.json();
                cont.innerHTML = orders.length ? '' : '<div class="empty-state">Aucune commande.</div>';
                orders.forEach(o => {
                    const d = document.createElement('div'); d.className = 'order-card';
                    const date = new Date(o.created_at).toLocaleDateString('fr-FR');
                    d.innerHTML = `<div class="order-status status-${o.status || 'pending'}">${o.status || 'En attente'}</div><div style="font-weight:900; font-size:15px; margin-bottom:5px;">Commande #${o.id.split('-')[0]}</div><div style="font-size:12px; opacity:0.5;">${date} • ${o.total_price || o.total}€</div>`;
                    cont.appendChild(d);
                });
            } catch(e) { cont.innerHTML = '<div class="empty-state">Erreur de chargement.</div>'; }
        }

        function openModal(pid, e) {
            if (e) e.stopPropagation();
            activeProduct = allProducts.find(x => x.id === pid);
            document.getElementById('modal-product-name').innerText = activeProduct.name;
            const cont = document.getElementById('modal-options'); cont.innerHTML = '';
            const uv = parseFloat(String(activeProduct.unit_value || '1').replace(',','.')) || 1;
            [1, 2, 3, 4, 5, 10].forEach(m => {
                let pr = m * activeProduct.price;
                if (activeProduct.has_discounts && activeProduct.discounts_config) {
                    const t = activeProduct.discounts_config.find(d => parseInt(d.qty) === m);
                    if (t) pr = parseFloat(t.total || t.total_price);
                }
                const d = document.createElement('div');
                d.style = "background:rgba(255,255,255,0.05); padding:15px; border-radius:20px; text-align:center; border:2px solid transparent;";
                d.onclick = () => { activeOption = { m, pr }; document.querySelectorAll('#modal-options div').forEach(o => o.style.borderColor = 'transparent'); d.style.borderColor = '#fff'; };
                d.innerHTML = `<div style="font-weight:800; font-size:15px;">${m*uv}${activeProduct.unit || 'g'}</div><div style="font-weight:900; color:var(--accent);">${pr.toFixed(0)}€</div>`;
                cont.appendChild(d);
                if (m === 1) { activeOption = { m, pr }; d.style.borderColor = '#fff'; }
            });
            document.getElementById('selection-modal').classList.add('open');
            tg.HapticFeedback.impactOccurred('light');
        }

        function closeSelectionModal() { document.getElementById('selection-modal').classList.remove('open'); }

        function addSelectionToCart() {
            const cid = `${activeProduct.id}_${activeOption.m}`;
            const ex = cart.find(i => i.cid === cid);
            if (ex) ex.n++; else cart.push({ cid, id: activeProduct.id, name: activeProduct.name, pr: activeOption.pr, m: activeOption.m, unit: activeProduct.unit || 'g', n: 1 });
            updateCartUI(); closeSelectionModal(); tg.HapticFeedback.notificationOccurred('success');
        }

        function updateCartUI() {
            const tot = cart.reduce((s, i) => s + (i.pr * i.n), 0);
            const count = cart.reduce((s, i) => s + i.n, 0);
            document.getElementById('cart-count').innerText = count;
            document.getElementById('cart-total').innerText = tot.toFixed(2) + '€';
            document.getElementById('cart-dot').style.display = count > 0 ? 'block' : 'none';
            const bar = document.getElementById('cart-bar');
            if (count > 0 && document.getElementById('page-shop').style.display !== 'none') bar.classList.add('visible');
            else bar.classList.remove('visible');
        }

        function openCheckout() {
            if (cart.length === 0) return tg.showAlert("Panier vide");
            document.getElementById('checkout-overlay').classList.add('open');
            renderCheckout();
            tg.HapticFeedback.impactOccurred('medium');
        }

        function closeCheckout() { document.getElementById('checkout-overlay').classList.remove('open'); }

        function renderCheckout() {
            const cont = document.getElementById('checkout-content');
            document.getElementById('checkout-footer').style.display = 'block';
            cont.innerHTML = '';
            cart.forEach((i, idx) => {
                const d = document.createElement('div');
                d.style = "background:var(--card); padding:15px; border-radius:20px; margin-bottom:10px; display:flex; align-items:center; gap:15px; border:1px solid var(--border);";
                d.innerHTML = `<div style="flex:1"><div style="font-weight:800; font-size:14px;">${i.name}</div><div style="color:var(--accent); font-weight:900; font-size:13px;">${i.pr}€</div></div><div style="display:flex; align-items:center; gap:12px;"><span style="opacity:0.4" onclick="updateN('${i.cid}', -1)">−</span><span style="font-weight:900">${i.n}</span><span style="color:var(--accent)" onclick="updateN('${i.cid}', 1)">+</span></div>`;
                cont.appendChild(d);
            });
            const tot = cart.reduce((s, i) => s + (i.pr * i.n), 0);
            document.getElementById('final-total').innerText = tot.toFixed(2) + '€';
        }

        function updateN(cid, d) {
            const i = cart.find(x => x.cid === cid); i.n += d;
            if (i.n <= 0) cart = cart.filter(x => x.cid !== cid);
            updateCartUI(); renderCheckout();
            if (cart.length === 0) closeCheckout();
        }

        function handleSearch() {
            const q = document.getElementById('search-input').value.toLowerCase();
            renderGrid(allProducts.filter(p => p.name.toLowerCase().includes(q)));
        }

        async function toggleF(pid, e) {
            e.stopPropagation();
            const p = allProducts.find(x => x.id === pid);
            const next = !p.is_featured;
            try {
                const res = await fetch('/api/admin/toggle-feature', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ userId: tg.initDataUnsafe?.user?.id, productId: pid, featured: next }) });
                if (res.ok) { p.is_featured = next; renderShop(); tg.HapticFeedback.notificationOccurred('success'); }
            } catch(e) {}
        }

        function updateProfileUI() {
            if (!userInfo) return;
            document.getElementById('user-balance').innerText = `${parseFloat(userInfo.balance).toFixed(2)}€`;
            document.getElementById('hotline-btn').onclick = () => tg.openTelegramLink(`https://t.me/${userInfo.hotline}`);
        }

        function copyReferral() { if (userInfo?.referralLink) { navigator.clipboard.writeText(userInfo.referralLink); tg.showAlert("Lien copié !"); } }

        init();
    </script>
</body>
</html>
